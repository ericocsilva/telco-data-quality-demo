# DQX rules for <catalog>.telco_dq_bronze.customers_raw (raw CRM feed, before SDP)
# Paste into DQX Studio (YAML mode) or load with DQEngine.load_checks / apply_checks_by_metadata.
- name: customer_id_not_empty
  criticality: error
  check:
    function: is_not_null_and_not_empty
    arguments:
      column: customer_id
- name: cpf_format
  criticality: error
  check:
    function: regex_match
    arguments:
      column: cpf
      regex: '^[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}$'
- name: cpf_unique
  criticality: warn
  check:
    function: is_unique
    arguments:
      columns: [cpf]
- name: valid_email
  criticality: warn
  check:
    function: is_valid_email
    arguments:
      column: email
# is_in_list values are SQL expressions: quote string literals ("'SP'")
- name: valid_uf
  criticality: error
  check:
    function: is_in_list
    arguments:
      column: uf
      allowed: ["'AC'", "'AL'", "'AP'", "'AM'", "'BA'", "'CE'", "'DF'", "'ES'", "'GO'", "'MA'", "'MT'", "'MS'", "'MG'", "'PA'", "'PB'", "'PR'", "'PE'", "'PI'", "'RJ'", "'RN'", "'RS'", "'RO'", "'RR'", "'SC'", "'SP'", "'SE'", "'TO'"]
- name: valid_segment
  criticality: error
  check:
    function: is_in_list
    arguments:
      column: segment
      allowed: ["'PRE'", "'CONTROLE'", "'POS'"]
- name: adult_customer
  criticality: warn
  check:
    function: sql_expression
    arguments:
      expression: "try_cast(birth_date AS DATE) <= add_months(current_date(), -216)"
      msg: "Customer must be 18+ (ANATEL/KYC rule)"
